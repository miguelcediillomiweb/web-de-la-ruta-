<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grupo Peñafiel</title>
  <meta name="theme-color" content="#0b3c6d">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="iconos/icon-192-1.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <h1>Grupo Peñafiel</h1>
    <p>Toca una marca para ver sus productos y precios.</p>
  </header>

  <main>
    <section class="buscador-panel" aria-label="Buscar productos">
      <label for="buscador-productos">🔎 ¿Qué se te antoja hoy?</label>
      <div class="buscador-campo">
        <span aria-hidden="true">⌕</span>
        <input id="buscador-productos" type="search" placeholder="Busca algún producto en especial…" autocomplete="off" aria-describedby="aviso-busqueda">
      </div>
      <p id="aviso-busqueda" class="aviso-busqueda">Escribe el nombre, sabor, presentación o marca para encontrar un producto.</p>
    </section>
    <div id="resultados-busqueda" class="resultados-busqueda" hidden></div>
    <div id="marcas" class="marcas"><p class="vacio">Cargando marcas…</p></div>
  </main>

  <dialog id="marca" class="ventana">
    <button class="x" aria-label="Cerrar">×</button>
    <div id="marca-contenido"></div>
  </dialog>

  <dialog id="video" class="ventana ventana-video">
    <button class="x" aria-label="Cerrar video">×</button>
    <div id="video-caja"><div id="reproductor"></div></div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script src="js/onesignal.js"></script>
</body>
</html>
